date.timezone = "UTC"
display_errors = 0
display_startup_errors = 0
expose_php = Off
log_errors = On
error_log = /proc/self/fd/2
max_execution_time = 30
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
cgi.fix_pathinfo = 0
