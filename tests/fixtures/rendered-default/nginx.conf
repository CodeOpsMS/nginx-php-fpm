worker_processes auto;
pid /tmp/nginx-php-fpm/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx-php-fpm/cache/client_temp;
    fastcgi_temp_path /tmp/nginx-php-fpm/cache/fastcgi_temp;
    proxy_temp_path /tmp/nginx-php-fpm/cache/proxy_temp;
    scgi_temp_path /tmp/nginx-php-fpm/cache/scgi_temp;
    uwsgi_temp_path /tmp/nginx-php-fpm/cache/uwsgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;
    root "@@DOCUMENT_ROOT@@";
    index index.php index.html;

    # HTTP-scope extensions (maps, log formats, upstreams, and similar).
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # Server-scope values override inherited defaults above. Loading this
        # before built-in regex locations also gives custom regexes priority.
        include /etc/nginx/server.d/*.conf;

        location = /healthz {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/lib/nginx-php-fpm/healthz.php;
            fastcgi_param SCRIPT_NAME /healthz;
            fastcgi_pass unix:/tmp/nginx-php-fpm/run/php-fpm.sock;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ (^|/)\. {
            deny all;
        }

        location ~ \.php(?:/|$) {
            try_files $fastcgi_script_name =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass unix:/tmp/nginx-php-fpm/run/php-fpm.sock;
        }
    }
}
