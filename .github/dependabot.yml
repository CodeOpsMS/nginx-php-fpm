version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "02:15"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /container/ci/kcov
    schedule:
      interval: daily
      time: "02:30"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:45"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /container/extensions
    schedule:
      interval: daily
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - php-extension
    commit-message:
      prefix: deps
