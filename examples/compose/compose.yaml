services:
  web:
    image: ${IMAGE:-ghcr.io/codeopsms/nginx-php-fpm:0.5.0}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      DOCUMENT_ROOT: /srv/app/public
      TZ: UTC
    volumes:
      - type: bind
        source: ./public
        target: /srv/app/public
        read_only: true
        bind:
          create_host_path: false
