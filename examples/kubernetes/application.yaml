apiVersion: v1
kind: ConfigMap
metadata:
  name: php-example-application
data:
  index.php: |
    <?php

    declare(strict_types=1);

    header('Content-Type: application/json');

    echo json_encode([
        'message' => 'Your PHP application is running.',
        'path' => parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH),
    ], JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES), "\n";
  example.txt: |
    This file is served directly by nginx.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: php-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: php-example
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        # This example uses only its own ConfigMap and emptyDir volumes.
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/codeopsms/nginx-php-fpm:0.5.0@sha256:51ed3a90780c217cb39d747e8e7b406c2563c1352866212a7953439a5c769f65
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCUMENT_ROOT
              value: /var/www/html
            - name: PHP_MEMORY_LIMIT
              value: 128M
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: application
              mountPath: /var/www/html
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: application-data
              mountPath: /srv/application-data
      volumes:
        - name: application
          configMap:
            name: php-example-application
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
        - name: application-data
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: php-example
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: php-example
  ports:
    - name: http
      port: 80
      targetPort: http
